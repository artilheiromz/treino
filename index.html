<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treino Bruno</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino">
<meta name="theme-color" content="#052b45">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=122">
<link rel="icon" type="image/png" href="icon-192.png?v=122">
<link rel="manifest" href="manifest.webmanifest?v=122">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: app de uma coluna para telemóvel, navegação fixa em baixo; tema escuro único (piscina à noite) */
:root{
  --bg:#08151d;
  --surface:#0f2230;
  --surface-2:#163044;
  --line:#21405a;
  --ink:#eaf3f7;
  --ink-2:#a9c2cf;
  --muted:#6f8ea0;
  --accent:#3fd0dc;
  --accent-soft:rgba(63,208,220,.16);
  --walk:#b59cf5;
  --walk-soft:rgba(181,156,245,.16);
  --warm:#f2b456;
  --good:#5fd08a;
  --display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
main{max-width:560px;margin:0 auto;padding:16px 16px calc(100px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:30px;font-weight:700;line-height:1.1}
h2{font-size:21px;font-weight:600}
h3{font-size:16px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.06em}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)} .sm{font-size:13px}
.stack{display:flex;flex-direction:column;gap:14px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.view{display:none} .view.on{display:flex}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:13px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.lane{height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--accent) 0 18px,transparent 18px 26px,#f25f5c 26px 34px,transparent 34px 42px);opacity:.55}

/* Início */
.menu{display:grid;gap:12px}
.mcard{appearance:none;text-align:left;width:100%;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.mcard .k{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.mcard .t{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.15}
.mcard .s{color:var(--ink-2);font-size:15px}
.mcard .go{grid-row:1 / span 3;grid-column:2;width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:22px;color:var(--accent)}
.mcard.main{background:linear-gradient(180deg,var(--surface-2),var(--surface));border-color:var(--accent)}
.mini{display:flex;gap:16px;flex-wrap:wrap;margin-top:4px}
.mini span{font-size:13px;color:var(--muted)} .mini b{display:block;font-family:var(--display);font-size:20px;color:var(--ink);font-weight:600}

/* Controles */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{appearance:none;border:0;background:transparent;padding:9px 6px;border-radius:9px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button{appearance:none;flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);padding:7px 12px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#04222a}
.navbtn{appearance:none;border:1px solid var(--line);background:var(--surface-2);width:44px;height:44px;border-radius:12px;font-size:22px;cursor:pointer}
.navbtn:disabled{opacity:.35;cursor:default}
.linkbtn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--accent);padding:6px 12px;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer}

/* Faixa da semana */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{appearance:none;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px}
.wd .a{font-size:11px;color:var(--muted);font-weight:700}
.wd .n{font-family:var(--display);font-size:19px;font-weight:600;line-height:1}
.wd .dot{width:8px;height:8px;border-radius:50%;background:transparent;border:1.5px solid var(--line)}
.wd .dot.swim{background:var(--accent);border-color:var(--accent)}
.wd .dot.walk{border-color:var(--walk);background:transparent}
.wd .dot.walkdone{background:var(--walk);border-color:var(--walk)}
.wd .dot.done{background:var(--good);border-color:var(--good)}
.wd.sel{border-color:var(--accent);background:var(--surface-2)}
.wd.today .n{color:var(--accent)}

/* Sessão */
.hero{background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:16px;padding:18px}
.hero.walk{border-color:rgba(181,156,245,.45)}
.big{font-size:44px;font-weight:700;line-height:1;color:var(--accent)}
.hero.walk .big{color:var(--walk)}
.pill{display:inline-flex;align-items:center;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.pill.today{background:var(--accent);color:#04222a;border-color:var(--accent)}
.pill.done{background:rgba(95,208,138,.15);color:var(--good);border-color:rgba(95,208,138,.4)}
.pill.miss{color:var(--warm);border-color:rgba(242,180,86,.4)}
.pill.opt{color:var(--walk);border-color:rgba(181,156,245,.4)}
.facts{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px}
.facts div{display:flex;flex-direction:column}
.facts b{font-family:var(--display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.facts span{font-size:13px;color:var(--muted)}
.result{border:1px solid rgba(95,208,138,.45);background:rgba(95,208,138,.07)}
.result.walkr{border-color:rgba(181,156,245,.45);background:var(--walk-soft)}
.pre{display:grid;gap:8px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--surface-2);cursor:pointer;user-select:none}
.chk input{width:20px;height:20px;accent-color:var(--accent);margin:2px 0 0;flex:none}
.blocks{display:flex;flex-direction:column;gap:10px}
.blk{appearance:none;display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:start;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%}
.blk .tick{width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-size:15px;color:transparent}
.blk.ok{opacity:.55}
.blk.ok .tick{background:var(--good);border-color:var(--good);color:#06240f}
.blk .lbl{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.blk .set{display:block;font-size:19px;font-weight:700;line-height:1.3;margin-top:2px}
.blk .rest{display:block;font-size:14px;color:var(--ink-2);margin-top:4px}
.blk .m{font-family:var(--display);font-size:22px;font-weight:600;text-align:right;white-space:nowrap}
.blk .m small{display:block;font-size:12px;color:var(--muted);font-family:var(--body)}
.int{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;margin-top:6px}
.int.leve{background:rgba(111,142,160,.2);color:var(--ink-2)}
.int.mod{background:var(--accent-soft);color:var(--accent)}
.int.forte{background:rgba(242,180,86,.16);color:var(--warm)}
.note{border-left:3px solid var(--accent);padding:10px 12px;background:var(--surface);border-radius:0 10px 10px 0;color:var(--ink-2)}
.note.warm{border-color:var(--warm)} .note.walk{border-color:var(--walk)}

/* Plano */
.week{display:flex;flex-direction:column;gap:8px}
.srow{appearance:none;display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%}
.srow.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.srow.w{padding:9px 14px;background:transparent;border-style:dashed}
.srow .d{font-family:var(--display);font-weight:600;line-height:1.1}
.srow .d small{display:block;color:var(--muted);font-family:var(--body);font-size:12px;font-weight:400}
.srow .t{font-weight:700}
.srow .t small{display:block;color:var(--muted);font-weight:400;font-size:13px}

/* Progresso */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile .k{font-size:13px;color:var(--muted)}
.tile .v{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .v small{font-size:15px;font-weight:500;color:var(--ink-2)}
.tile .dlt{font-size:13px;font-weight:700}
.dn{color:var(--good)} .up{color:var(--warm)} .eq{color:var(--muted)}
.bar{height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;font-weight:700;padding:5px 8px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-130%);display:none;z-index:2}
.legend{display:flex;gap:14px;font-size:13px;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:700;font-size:12px}
th:first-child,td:first-child{text-align:left}
.mt{display:grid;grid-template-columns:1fr auto auto;gap:4px 14px;align-items:baseline}
.mt .h{font-size:12px;color:var(--muted);font-weight:700;text-align:right}
.mt .l{color:var(--ink-2)}
.mt .v{font-family:var(--display);font-size:20px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.mt .d{text-align:right;font-size:13px;font-weight:700}

/* Navegação fixa */
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(8,21,29,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{appearance:none;border:0;background:transparent;color:var(--muted);font:700 13px var(--body);padding:9px 2px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.lock{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.lock[hidden],main[hidden],nav[hidden]{display:none}
.lockcard{width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.lockcard input#pin{width:100%;font:700 32px var(--display);letter-spacing:.4em;text-align:center;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.lockcard input#pin:focus{outline:2px solid var(--accent);outline-offset:2px}
.lemb{display:flex;gap:8px;align-items:center;color:var(--ink-2);font-size:14px}
.lemb input{width:18px;height:18px;accent-color:var(--accent)}
#lockbtn{appearance:none;width:100%;border:0;border-radius:14px;padding:14px;background:var(--accent);color:#04222a;font:700 18px var(--body);cursor:pointer}
#lockbtn:disabled{opacity:.6}
.cartao{position:fixed;inset:0;z-index:20;background:#000;color:#fff;display:flex;flex-direction:column;padding:calc(30vh + env(safe-area-inset-top)) 22px calc(110px + env(safe-area-inset-bottom));overflow:auto}
.cartao[hidden]{display:none}
.cartao .ct{font:700 30px/1.1 var(--display)}
.cartao .cs{color:var(--ink-2);font-size:16px;margin-top:4px}
.cartao .clist{margin:20px 0 0;padding-left:30px;display:flex;flex-direction:column;gap:14px;font:600 23px/1.25 var(--body)}
.cartao .clist li::marker{color:var(--accent);font-weight:700}
.cartao .clist em{display:block;font-style:normal;color:var(--accent);font-size:17px;font-weight:700;margin-top:2px}
.cartao .cfoot{margin-top:20px;color:var(--warm);font-size:15px;font-weight:700}

/* ===== Tema vidro (v1.2.0): fundo de água azul + superfícies translúcidas ===== */
:root{--bg:#052b45;--surface:rgba(255,255,255,.13);--surface-2:rgba(255,255,255,.2);--line:rgba(255,255,255,.28);
  --ink:#ffffff;--ink-2:rgba(255,255,255,.92);--muted:rgba(255,255,255,.8);--accent:#b8f6ff;--accent-soft:rgba(255,255,255,.22);
  --walk:#e4dbff;--walk-soft:rgba(214,200,255,.16);--warm:#ffd27a;--good:#9dffc4;
  --glass-bg:rgba(255,255,255,.13);--glass-strong:rgba(255,255,255,.2);--glass-line:rgba(255,255,255,.28);
  --glass-blur:blur(26px) saturate(170%);--glass-shadow:inset 0 1px 0 rgba(255,255,255,.42),0 10px 28px rgba(2,16,30,.22);
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Atkinson Hyperlegible",system-ui,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Barlow Semi Condensed",system-ui,sans-serif}
body{background:#052b45}
.bgwater{position:fixed;inset:0;z-index:-1;pointer-events:none;background-color:#052b45;background-image:
  radial-gradient(120% 55% at 10% 0%,#22b8dc 0%,rgba(34,184,220,0) 60%),
  radial-gradient(90% 50% at 100% 40%,#2f62ff 0%,rgba(47,98,255,0) 62%),
  radial-gradient(100% 55% at 0% 100%,#10c9a8 0%,rgba(16,201,168,0) 58%),
  radial-gradient(80% 45% at 95% 100%,#5b46e8 0%,rgba(91,70,232,0) 60%)}
.bgwater svg{position:absolute;inset:0;width:100%;height:100%;opacity:.14}
h1{font-weight:700;letter-spacing:-.01em}
.card,.tile,.mcard,.srow,.blk,.wd,.seg,.chips button,.navbtn,.linkbtn,.note,.chk,.hero,.lockcard input#pin{
  background:var(--glass-bg);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-line);box-shadow:var(--glass-shadow);color:#fff}
.card{border-radius:24px}.tile{border-radius:20px}.mcard{border-radius:26px}.srow,.blk{border-radius:20px}.hero{border-radius:28px}
.mcard.main,.hero{background:var(--glass-strong);border-color:rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 14px 36px rgba(2,16,30,.3)}
.hero.walk{border-color:rgba(214,200,255,.6)}
.mcard .go{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);border-radius:22px;color:#fff}
.mcard .k,.blk .lbl,h3{color:rgba(255,255,255,.88)}
.mini span{color:rgba(255,255,255,.85)}
.note{border-left:1px solid var(--glass-line);border-radius:18px;color:rgba(255,255,255,.92)}
.note.warm{border-color:rgba(255,210,122,.55)}.note.walk{border-color:rgba(214,200,255,.55)}
.result{background:rgba(120,255,190,.12);border-color:rgba(160,255,205,.42)}
.result.walkr{background:rgba(214,200,255,.14);border-color:rgba(214,200,255,.45)}
.srow.now{background:var(--glass-strong);border:1.5px solid rgba(255,255,255,.65);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 12px 30px rgba(2,16,30,.28)}
.srow.w{background:rgba(255,255,255,.05);border:1px dashed rgba(214,200,255,.5);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.wk{gap:4px}.wd{border-radius:16px}
.wd.sel{background:#fff;border-color:#fff;color:#06324d}.wd.sel .a{color:#1b5878}.wd.sel .n,.wd.sel.today .n{color:#06324d}
.wd.today .n{color:var(--accent)}
.wd .dot{border-color:rgba(255,255,255,.45)}.wd .dot.swim{background:#b8f6ff;border-color:#b8f6ff}.wd .dot.done{background:#9dffc4;border-color:#9dffc4}
.wd.sel .dot.swim{background:#0b8fb3;border-color:#0b8fb3}.wd.sel .dot.done{background:#14a35c;border-color:#14a35c}
.pill{border-color:rgba(255,255,255,.4);color:#fff}
.pill.today{background:#fff;color:#06324d;border-color:#fff}
.pill.done{background:rgba(120,255,190,.22);color:#c9ffe1;border-color:rgba(160,255,205,.45)}
.pill.miss{color:#ffe3a6;border-color:rgba(255,210,122,.55)}
.pill.opt{color:#e4dbff;border-color:rgba(214,200,255,.55)}
.seg{border-radius:22px;padding:4px}.seg button{border-radius:18px;color:#fff}
.seg button[aria-pressed="true"]{background:#fff;color:#06324d;box-shadow:0 4px 12px rgba(2,16,30,.22)}
.chips button{border-radius:17px;box-shadow:none}
.chips button[aria-pressed="true"]{background:rgba(255,255,255,.34);border-color:rgba(255,255,255,.6);color:#fff}
.navbtn{border-radius:22px}.linkbtn{color:#fff;border-radius:999px}
.int.leve{background:rgba(255,255,255,.16);color:#fff}.int.mod{background:rgba(184,246,255,.2);color:#b8f6ff}.int.forte{background:rgba(255,210,122,.2);color:#ffd27a}
.blk .tick{border-color:rgba(255,255,255,.6)}.blk.ok .tick{background:#9dffc4;border-color:#9dffc4}
.bar{background:rgba(255,255,255,.18)}.bar i{background:#b8f6ff;box-shadow:0 0 12px rgba(184,246,255,.7)}
th,td{border-bottom-color:rgba(255,255,255,.18)}th{color:rgba(255,255,255,.8)}
.lane{opacity:.4}
.dn{color:#9dffc4}.up{color:#ffd27a}.eq{color:rgba(255,255,255,.75)}
nav{left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));padding:6px;border-radius:34px;border:1px solid rgba(255,255,255,.36);
  background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 16px 40px rgba(2,16,30,.35)}
nav .in{gap:4px}
.tab{border-radius:28px;color:rgba(255,255,255,.9)}
.tab[aria-current="page"]{color:#fff;background:rgba(255,255,255,.28)}
main{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
#lockbtn{background:#fff;color:#06324d;border-radius:18px}
.lockcard input#pin{border-radius:18px}
.lemb{color:rgba(255,255,255,.9)}

/* ===== v1.3.0: disposição igual ao mockup ===== */
.hi{font-size:34px}
.menu{gap:14px}
.mcard.main .t{font-size:28px}
.gcard{appearance:none;text-align:left;width:100%;cursor:pointer;display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:28px;font:inherit;
  background:var(--glass-bg);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid var(--glass-line);box-shadow:var(--glass-shadow);color:#fff}

];
const PLANO_INI="2026-11-02", PLANO_FIM="2026-11-29";
const SEMANAS = { 1:["2026-11-02","2026-11-08"], 2:["2026-11-09","2026-11-15"], 3:["2026-11-16","2026-11-22"], 4:["2026-11-23","2026-11-29"] };
const CAMINHADA = { nome:"Caminhada", alvo:"30–45 min", obj:60,
  passos:["Ritmo em que consigas falar, mas sintas a respiração mais activa","Primeiros 5 min devagar para aquecer","Apple Watch: Caminhada ao ar livre","Sapatilhas confortáveis e água"] };

/* ===== Utilitários ===== */
const DIAS=["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
const DC=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const MES=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const pd=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d);};
const HOJE=iso(new Date());
const f1=n=>n.toFixed(1).replace(".",",");
const sg=n=>(n>0?"+":n<0?"−":"±")+f1(Math.abs(n));
const curto=s=>{const d=pd(s);return d.getDate()+" "+MES[d.getMonth()];};
const longo=s=>{const d=pd(s);return DIAS[d.getDay()]+", "+d.getDate()+" "+MES[d.getMonth()];};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtMin=m=>{m=Math.round(m);return m>=60?Math.floor(m/60)+" h "+String(m%60).padStart(2,"0"):m+" min";};
const mmss=sec=>{sec=Math.round(sec);return Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");};
const store={get(k){try{return JSON.parse(localStorage.getItem(k)||"null");}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const ACT=()=>DADOS.atividades;
const swims=()=>ACT().filter(a=>a.tipo==="natacao");
const walks=()=>ACT().filter(a=>a.tipo==="caminhada");
const actsDia=d=>ACT().filter(a=>a.data===d);
const sessaoDia=d=>PLANO.find(s=>s.data===d);
const feito=id=>ACT().find(a=>a.sessao===id);
const pesDia=d=>DADOS.pesagens.find(p=>p.data===d);
const semanaDe=d=>{for(const w in SEMANAS){if(d>=SEMANAS[w][0]&&d<=SEMANAS[w][1])return +w;}return 0;};
const dTxt=b=>b.d&&/×/.test(b.s)&&/^desc\./.test(b.d)?b.d+" entre repetições":b.d;
const intCls=i=>i==="Forte"?"forte":i==="Moderado"?"mod":"leve";
function delta(v,inv){const c=Math.abs(v)<0.05?"eq":((v<0)===inv?"dn":"up");return `<span class="dlt ${c}">${sg(v)}</span>`;}

/* Agenda de um dia */
function agenda(d){
  const s=sessaoDia(d), dow=pd(d).getDay();
  if(s) return {tipo:"natacao", s};
  if(d<PLANO_INI) return {tipo:"antes"};
  if(d>PLANO_FIM) return {tipo:"depois"};
  if(dow===3||dow===0) return {tipo:"caminhada"};
  return {tipo:"descanso", sexta:dow===5};
}
function estadoSessao(s){
  if(feito(s.id)) return {c:"done",t:"Feito"};
  if(s.data===HOJE) return {c:"today",t:"Hoje"};
  if(s.data<HOJE) return {c:"miss",t:"Sem registo"};
  if(PLANO.find(x=>x.data>HOJE)===s) return {c:"today",t:"Próximo"};
  return {c:"",t:DC[pd(s.data).getDay()]};
}

/* ===== Gráficos ===== */
function lineChart(pts,opt){
  const W=340,H=150,L=8,R=46,T=18,Bm=24;
  if(pts.length<2) return `<div class="muted sm">${opt.vazio||"Aparece quando houver pelo menos 2 registos."}</div>`;
  const xs=pts.map(p=>pd(p.x).getTime()), x0=Math.min(...xs), x1=Math.max(...xs);
  const ys=pts.map(p=>p.y); let y0=Math.min(...ys), y1=Math.max(...ys);
  const pad=Math.max((y1-y0)*0.25,opt.minPad||1); y0-=pad; y1+=pad;
  const X=t=>L+(x1===x0?0.5:(t-x0)/(x1-x0))*(W-L-R);
  const Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-Bm);
  const P=pts.map((p,i)=>[X(xs[i]),Y(p.y)]);
  const line=P.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=line+` L${P[P.length-1][0].toFixed(1)} ${H-Bm} L${P[0][0].toFixed(1)} ${H-Bm} Z`;
  const gid="g"+Math.random().toString(36).slice(2,7);
  const fmt=opt.fmt||(v=>f1(v));
  const sel=pts.findIndex(p=>p.x===opt.sel);
  const grid=[0.25,0.5,0.75].map(f=>{const yy=T+f*(H-T-Bm);return `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-dasharray="2 4"/>`;}).join("");
  const last=P[P.length-1], first=P[0];
  const xl=pts.map((p,i)=>{ if(pts.length>6 && i%Math.ceil(pts.length/5)!==0 && i!==pts.length-1) return "";
    return `<text x="${P[i][0]}" y="${H-6}" fill="var(--muted)" font-size="11" text-anchor="${i===0?"start":i===pts.length-1?"end":"middle"}">${curto(p.x)}</text>`;}).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.aria)}" font-family="Atkinson Hyperlegible, sans-serif">
    <defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${opt.c}" stop-opacity=".28"/><stop offset="1" stop-color="${opt.c}" stop-opacity="0"/></linearGradient></defs>
    ${grid}<line x1="${L}" x2="${W-R}" y1="${H-Bm}" y2="${H-Bm}" stroke="var(--line)"/>
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="${opt.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${sel>=0?`<line x1="${P[sel][0]}" x2="${P[sel][0]}" y1="${T-6}" y2="${H-Bm}" stroke="var(--ink-2)" stroke-dasharray="3 3"/>`:""}
    ${P.map((p,i)=>{const e=i===P.length-1||i===sel;return `<circle cx="${p[0]}" cy="${p[1]}" r="${e?5:3.5}" fill="${e?opt.c:"var(--surface)"}" stroke="${opt.c}" stroke-width="2"/>`;}).join("")}
    <text x="${first[0]+2}" y="${first[1]-9}" fill="var(--ink-2)" font-size="12">${fmt(pts[0].y)}</text>
    <text x="${last[0]+9}" y="${last[1]+4}" fill="var(--ink)" font-size="14" font-weight="700" font-family="Barlow Semi Condensed, sans-serif">${fmt(pts[pts.length-1].y)}</text>
    ${xl}
    ${P.map((p,i)=>`<circle class="hit" cx="${p[0]}" cy="${p[1]}" r="16" fill="transparent" data-t="${curto(pts[i].x)}: ${fmt(pts[i].y)}${opt.u||""}"/>`).join("")}
  </svg><div class="tip"></div></div>`;
}
function barChart(rows,opt){
  const W=340,H=150,L=8,R=8,T=20,Bm=24;
  const max=Math.max(1,...rows.map(r=>Math.max(r.plan,r.done)))*1.12;
  const bw=(W-L-R)/rows.length, Y=v=>T+(1-v/max)*(H-T-Bm);
  let s=`<line x1="${L}" x2="${W-R}" y1="${H-Bm}" y2="${H-Bm}" stroke="var(--line)"/>`;
  rows.forEach((r,i)=>{
    const cx=L+bw*i+bw/2, w=Math.min(46,bw*0.62), yp=Y(r.plan), yd=Y(r.done);
    if(r.plan>0) s+=`<rect x="${cx-w/2}" y="${yp}" width="${w}" height="${H-Bm-yp}" rx="4" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="3 3"/>`;
    if(r.done>0) s+=`<rect x="${cx-w/2+3}" y="${yd}" width="${w-6}" height="${H-Bm-yd}" rx="4" fill="${opt.c}"/>`;
    s+=`<text x="${cx}" y="${Math.min(yp,yd)-6}" fill="var(--ink-2)" font-size="12" text-anchor="middle" font-family="Barlow Semi Condensed, sans-serif" font-weight="600">${r.done?r.done+" / ":""}${r.plan}</text>`;
    s+=`<text x="${cx}" y="${H-6}" fill="var(--muted)" font-size="11" text-anchor="middle">${r.lbl}</text>`;
    s+=`<rect class="hit" x="${L+bw*i}" y="${T}" width="${bw}" height="${H-T-Bm}" fill="transparent" data-t="${r.lbl}: ${r.done} ${opt.u} de ${r.plan} ${opt.u}"/>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.aria)}" font-family="Atkinson Hyperlegible, sans-serif">${s}</svg><div class="tip"></div></div>`;
}
function wireTips(root){
  root.querySelectorAll(".chart").forEach(ch=>{const tip=ch.querySelector(".tip"); if(!tip) return;
    ch.querySelectorAll(".hit").forEach(h=>{
      const show=()=>{const r=ch.getBoundingClientRect(),b=h.getBoundingClientRect();
        tip.textContent=h.dataset.t;tip.style.display="block";
        tip.style.left=Math.max(70,Math.min(r.width-70,b.left-r.left+b.width/2))+"px";tip.style.top=(b.top-r.top+b.height/2)+"px";};
      h.addEventListener("pointerenter",show);h.addEventListener("click",show);

/* ===== Estatísticas de treino ===== */
const secs=r=>{if(!r)return null;const[a,b]=String(r).split(":").map(Number);return isNaN(a)?null:a*60+(b||0);};
function ritmoSeg(x){ // ritmo do Apple Watch (sem descansos); se faltar, tempo total / distância
  const r=secs(x.ritmo); if(r) return r;
  return (x.distancia&&x.duracao)? x.duracao*60/x.distancia*100 : null;
}
function statsNat(lista){
  const m=lista.reduce((a,x)=>a+(x.distancia||0),0), min=lista.reduce((a,x)=>a+(x.duracao||0),0);
  const comR=lista.filter(x=>ritmoSeg(x)&&x.distancia), md=comR.reduce((a,x)=>a+x.distancia,0);
  const r=md?comR.reduce((a,x)=>a+ritmoSeg(x)*x.distancia,0)/md:null;
  return {n:lista.length,m,min,ritmo:r?mmss(r):"—"};
}
function statsCam(lista){
  const km=lista.reduce((a,x)=>a+(x.distancia||0),0), min=lista.reduce((a,x)=>a+(x.duracao||0),0);
  return {n:lista.length,km,min,ritmo:km?mmss(min*60/km):"—"};
}
function semanaAtual(){ return semanaDe(HOJE)||(HOJE<PLANO_INI?1:4); }

function sparkPeso(P){
  const W=300,H=58,ys=P.map(p=>p.peso),y0=Math.min(...ys)-0.6,y1=Math.max(...ys)+0.6;
  const xs=P.map(p=>pd(p.data).getTime()),x0=Math.min(...xs),x1=Math.max(...xs);
  const pt=P.map((p,i)=>[6+(x1===x0?0.5:(xs[i]-x0)/(x1-x0))*(W-12),4+(1-(p.peso-y0)/(y1-y0))*(H-8)]);
  const d=pt.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Peso desde ${curto(P[0].data)}: de ${f1(P[0].peso)} para ${f1(P[P.length-1].peso)} kg" style="width:100%;height:auto;display:block">

    <path d="${d} L${L[0].toFixed(1)} ${H} L${pt[0][0].toFixed(1)} ${H} Z" fill="url(#spk)"/>
    <path d="${d}" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${pt.slice(0,-1).map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="2.8" fill="#0b4d70" stroke="#fff" stroke-width="1.6"/>`).join("")}

}

  const mv=n=>{const x=addD(diaSel,n); if(x<DIA_MIN||x>DIA_MAX) return; diaSel=x; renderTreinos(); window.scrollTo(0,0);};

      c=c.includes(i)?c.filter(x=>x!==i):c.concat(i);store.set("nat-"+s.id,c);renderTreinos();});
    el.querySelectorAll("[data-pre]").forEach(cb=>cb.onchange=()=>{const i=+cb.dataset.pre;let c=store.get("nat-pre-"+d)||[];
      c=cb.checked?c.concat(i):c.filter(x=>x!==i);store.set("nat-pre-"+d,c);});

  const ac=el.querySelector("#abrirCartao"); if(ac) ac.onclick=()=>abrirCartao(ag.s);
}

  [1,2,3,4].forEach(w=>{
    const [i0,i1]=SEMANAS[w];
    const ss=PLANO.filter(s=>s.sem===w), tot=ss.reduce((a,s)=>a+s.total,0);
    const fx=swims().filter(x=>x.data>=i0&&x.data<=i1).reduce((a,x)=>a+(x.distancia||0),0);

        rows+=`<button class="srow w ${x===HOJE?"now":""}" data-d="${x}"><span class="d">${curto(x)}<small>${DIAS[pd(x).getDay()]}</small></span>

    h+=`<div class="week"><div class="spread"><h2>Semana ${w} <span class="muted" style="font-size:15px;font-weight:500">${curto(i0)}–${curto(i1)}</span></h2>

const VIEWS=["inicio","treinos","progresso","plano"];
function go(v){ if(location.hash!=="#"+v) location.hash=v; else show(v); }
function show(v){
  if(!VIEWS.includes(v)) v="inicio";
  VIEWS.forEach(n=>{document.getElementById("v-"+n).classList.toggle("on",n===v);
    const t=document.getElementById("t-"+n); if(n===v) t.setAttribute("aria-current","page"); else t.removeAttribute("aria-current");});
  ({inicio:renderInicio,treinos:renderTreinos,progresso:renderProgresso,plano:renderPlano})[v]();
  window.scrollTo(0,0);
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{ if(t.dataset.v==="treinos" && location.hash!=="#treinos") diaSel=HOJE<DIA_MIN?DIA_MIN:HOJE>DIA_MAX?DIA_MAX:HOJE; go(t.dataset.v); });
window.addEventListener("hashchange",()=>{ if(DADOS) show(location.hash.slice(1)); });

/* ===== Código de acesso ===== */
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abrir(pin){
  const r=await fetch("dados.enc.json?t="+Date.now(),{cache:"no-store"});
  if(!r.ok) throw new Error("rede");
  const e=await r.json();
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(e.salt),iterations:e.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  let pt; try{ pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(e.iv)},key,b64(e.ct)); }catch(x){ throw new Error("codigo"); }
  return JSON.parse(new TextDecoder().decode(pt));
}
function iniciar(d){
  DADOS=d; DIA_MIN=DADOS.perfil.inicio;
  diaSel=HOJE<DIA_MIN?DIA_MIN:HOJE>DIA_MAX?DIA_MAX:HOJE;
  document.getElementById("lock").hidden=true;
  document.querySelector("main").hidden=false; document.querySelector("nav").hidden=false;
  show(location.hash.slice(1)||"inicio");
}
function bloquear(){ try{localStorage.removeItem("treino-pin");}catch(e){} location.hash=""; location.reload(); }
(async()=>{
  const f=document.getElementById("lockf"), inp=document.getElementById("pin"), msg=document.getElementById("lockmsg"), btn=document.getElementById("lockbtn"), lem=document.getElementById("lembrar");
  let guardado=null; try{guardado=localStorage.getItem("treino-pin");}catch(e){}
  if(guardado){ msg.textContent="A abrir…"; try{ iniciar(await abrir(guardado)); return; }catch(e){ msg.textContent=e.message==="rede"?"Sem ligação à internet. Tenta outra vez.":""; try{localStorage.removeItem("treino-pin");}catch(x){} } }
  inp.focus();
  f.addEventListener("submit",async ev=>{
    ev.preventDefault(); const pin=inp.value.trim(); if(!pin) return;
    btn.disabled=true; msg.textContent="A abrir…";
    try{ const d=await abrir(pin); if(lem.checked){ try{localStorage.setItem("treino-pin",pin);}catch(e){} } iniciar(d); }
    catch(e){ msg.textContent=e.message==="codigo"?"Código errado. Tenta outra vez.":"Sem ligação à internet. Tenta outra vez."; inp.value=""; inp.focus(); }
    btn.disabled=false;
  });
})();
